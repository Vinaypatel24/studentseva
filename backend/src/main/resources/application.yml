server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

spring:
  application:
    name: studentseva-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres.gesveqbuqntwaipljhxo}
    password: ${DB_PASSWORD:StudentSeva@2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Exclude only mail for now until we configure Gmail SMTP credentials in Day 4
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# ── StudentSeva custom application config ──────────────────────────────────────
app:
  # Frontend URL — used by CORS to allow only our React app to call the API
  # In dev: http://localhost:5173 (Vite default port)
  # In prod (Render + Vercel): set FRONTEND_URL env var in Render dashboard
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  # JWT Configuration (Day 3 - Phase 2: used by JwtService)
  jwt:
    # Secret key for signing tokens — MUST be set via JWT_SECRET env var in production
    secret: ${JWT_SECRET:super_secret_jwt_key_studentseva_2026_for_signing_http_only_cookie_tokens}
    # Token validity: 86400000 ms = 24 hours
    expiration-ms: 86400000
    # Name of the httpOnly cookie that stores the JWT
    cookie-name: nearbuzz_token
